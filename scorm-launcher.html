<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09843B">
  <title>OVA · Sistemas Operativos — Universidad Simón Bolívar</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#f3f7f4; }
    #ova-content { display:block; width:100%; height:100%; border:0; background:#f3f7f4; }
    #scorm-notice {
      position:fixed; z-index:9999; left:16px; right:16px; bottom:16px;
      max-width:620px; margin:auto; padding:11px 15px;
      border:1px solid #e4c98e; border-radius:12px;
      background:rgba(255,250,235,.97); color:#654b17;
      box-shadow:0 8px 24px rgba(20,40,24,.14);
      font:500 13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    #scorm-notice[hidden] { display:none; }
  </style>
</head>
<body>
  <iframe id="ova-content" title="Objeto Virtual de Aprendizaje: Sistemas Operativos" allow="fullscreen"></iframe>
  <div id="scorm-notice" role="status" aria-live="polite" hidden></div>
  <script src="scorm-bridge.js"></script>
</body>
</html>
